# Source Code Pro uses the same family name on older and newer Kitty versions.
font_family Source Code Pro
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

copy_on_select clipboard
tab_bar_style slant
tab_bar_align center

foreground #f8f8f2
background #171812
background_opacity 0.8
dynamic_background_opacity yes

color0  #000000
color1  #cc0000
color2  #4d9a05
color3  #c3a000
color4  #3464a3
color5  #754f7b
color6  #05979A
color7  #d3d6cf
color8  #545652
color9  #ef2828
color10 #89e234
color11 #fbe84f
color12 #729ecf
color13 #ac7ea8
color14 #34E2E2
color15 #ededeb

allow_remote_control yes
map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
